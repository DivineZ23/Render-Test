name: imperial-estates
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MongoDb__ConnectionString: ${MONGODB_CONNECTION_STRING:?Set MONGODB_CONNECTION_STRING in .env}
      MongoDb__DatabaseName: ${MONGODB_DATABASE:-imperialEstates}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-ImperialEstates}
      Jwt__Audience: ${JWT_AUDIENCE:-ImperialEstates.Web}
      Discord__ClientId: ${DISCORD_CLIENT_ID}
      Discord__ClientSecret: ${DISCORD_CLIENT_SECRET}
      Discord__RedirectUri: ${DISCORD_REDIRECT_URI:-http://localhost:5080/api/v1/auth/discord/callback}
      Access__OwnerDiscordUserId: ${OWNER_DISCORD_USER_ID}
      App__FrontendUrl: ${FRONTEND_URL:-http://localhost:4200}
      Storage__ZiplineBaseUrl: ${ZIPLINE_BASE_URL}
      Storage__ZiplineApiToken: ${ZIPLINE_API_TOKEN}
      GoogleSheets__SpreadsheetId: ${GOOGLE_SHEETS_SPREADSHEET_ID}
      GoogleSheets__SheetId: ${GOOGLE_SHEETS_SHEET_ID:-0}
      GoogleSheets__ClientEmail: ${GOOGLE_SHEETS_CLIENT_EMAIL}
      GoogleSheets__PrivateKey: ${GOOGLE_SHEETS_PRIVATE_KEY}
      SeedData__Enabled: ${SEED_DATA:-false}
    ports:
      - "5080:8080"
    volumes:
      - uploads:/app/wwwroot/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "4200:80"

volumes:
  uploads:
